version: "3.7"

services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./bells.json:/app/bells.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
